# Minimal nested Hyprland config for omarchy-testar.
# Do NOT bind host-destructive actions. Explorer input must target this seat only.

# Nested Aquamarine exposes a WAYLAND-1 output to the host compositor.
monitor = WAYLAND-1, 1280x800@60, 0x0, 1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

decoration {
    rounding = 4
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

# Empty bind section on purpose — host binds must not leak into the nested seat.
# Launch the SUT explicitly from scripts/nested-seat.sh.

animations {
    enabled = false
}

# Keep a terminal ready for AT-SPI smoke targets inside the nested seat.
exec-once = foot || true
